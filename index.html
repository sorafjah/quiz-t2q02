<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>画像付き2択クイズ (ローカル＆データ移動版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid #3b82f6; outline-offset: 2px; }
    .loader { border: 4px solid #f3f4f6; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
    .transfer-area { background-color: #f0f9ff; border: 2px dashed #6366f1; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-2xl mx-auto">
    <!-- ===== ホーム画面 ===== -->
    <div id="home-screen" class="bg-white p-6 sm:p-8 rounded-xl shadow-lg space-y-6">
      <h1 class="text-3xl font-bold text-center text-gray-900">画像付き2択クイズ</h1>
      <p class="text-center text-gray-500 text-sm">PCで作ってJSONをコピーし、iPadで遊べます。</p>

      <!-- 新規作成 -->
      <div>
        <button id="create-new-quiz-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300 text-lg shadow">新しいクイズを作成する</button>
      </div>

      <div class="relative">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
        <div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-gray-500">保存済み / インポート</span></div>
      </div>

      <!-- ローカル保存リスト -->
      <div class="bg-gray-50 p-4 rounded-lg">
        <label class="block text-sm font-bold text-gray-700 mb-2">ブラウザに保存されたクイズ</label>
        <select id="saved-quiz-select" class="w-full p-2 border border-gray-300 rounded-lg mb-2 bg-white">
          <option value="">選択してください...</option>
        </select>
        <div class="flex gap-2">
          <button id="load-local-edit-btn" class="flex-1 bg-yellow-100 text-yellow-800 font-bold py-2 rounded hover:bg-yellow-200 transition">編集</button>
          <button id="load-local-play-btn" class="flex-1 bg-green-100 text-green-800 font-bold py-2 rounded hover:bg-green-200 transition">プレイ</button>
          <button id="delete-local-btn" class="px-3 bg-red-100 text-red-800 font-bold py-2 rounded hover:bg-red-200 transition">削除</button>
        </div>
      </div>

      <!-- JSONインポート（iPad用） -->
      <div class="transfer-area p-4 rounded-xl">
        <h2 class="text-md font-bold text-indigo-700 mb-2 flex items-center gap-2">
          <span class="bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded-full">iPadで遊ぶ場合</span>
          データの読み込み
        </h2>
        <p class="text-xs text-gray-600 mb-2">PCから送ったJSONコードをここに貼り付けてください。</p>
        <textarea id="import-json-area" rows="3" class="w-full p-2 border border-indigo-200 rounded text-xs font-mono mb-2" placeholder='{"questions": [...]}'></textarea>
        <div class="flex gap-2">
          <button id="import-play-btn" class="flex-1 bg-indigo-500 text-white font-bold py-2 rounded hover:bg-indigo-600 transition shadow">読み込んで開始</button>
        </div>
      </div>
    </div>

    <!-- ===== 編集画面 ===== -->
    <div id="edit-screen" class="hidden bg-white p-6 sm:p-8 rounded-xl shadow-lg space-y-6">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold text-gray-900">作成・編集</h2>
        <button id="back-to-home-btn" class="text-sm text-gray-500 hover:text-gray-700 underline">ホームに戻る</button>
      </div>

      <div class="space-y-2">
        <label for="quiz-name-edit" class="block text-sm font-medium text-gray-700">クイズ名 (保存用)</label>
        <input id="quiz-name-edit" type="text" class="w-full p-3 border border-gray-300 rounded-lg" placeholder="例: 動物クイズ"/>
      </div>

      <!-- JSONエクスポートエリア -->
      <div class="bg-indigo-50 p-4 rounded-lg border border-indigo-100">
        <label class="block text-sm font-bold text-indigo-800 mb-1">データ書き出し (JSON)</label>
        <p class="text-xs text-indigo-600 mb-2">このコードをコピーしてiPadに送ると、iPadで遊べます。</p>
        <div class="flex gap-2">
          <button id="copy-json-btn" class="bg-white border border-indigo-300 text-indigo-600 font-bold py-2 px-4 rounded hover:bg-indigo-50 transition text-sm flex-1">
            クリップボードにコピー
          </button>
        </div>
        <textarea id="json-input" rows="4" class="w-full p-2 mt-2 border border-gray-300 rounded text-xs font-mono" placeholder="ここにJSONが表示されます"></textarea>
      </div>

      <div id="edit-forms-container" class="space-y-6 border-t border-gray-200 pt-6">
        <p class="text-center text-gray-500">問題を追加してください。</p>
      </div>

      <div class="border-t border-gray-200 pt-4">
        <button id="add-question-btn" type="button" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 px-4 rounded-lg transition duration-300 border border-gray-300">+ 問題を追加する</button>
      </div>

      <div class="pt-4">
        <button id="save-local-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-lg text-lg">ブラウザに保存する</button>
      </div>
    </div>

    <!-- ===== 実行画面 ===== -->
    <div id="quiz-screen" class="hidden bg-white p-6 sm:p-8 rounded-xl shadow-lg space-y-4">
      <div id="question-img-container" class="hidden my-4">
        <img id="question-img" src="" class="w-full h-auto object-contain rounded-lg aspect-video mx-auto bg-black/5" alt="">
      </div>

      <div class="bg-gray-50 p-4 rounded-lg">
        <p id="question-text" class="text-xl font-semibold text-center min-h-[3em] flex items-center justify-center">問題文</p>
      </div>

      <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <button id="option-a-btn" data-option="A" class="option-btn flex flex-col items-center justify-center p-2 border-4 border-transparent rounded-xl hover:border-blue-500 focus:border-blue-500 transition-all duration-300 space-y-2 bg-gray-50">
          <img id="option-a-img" src="" class="w-full h-auto object-contain rounded-lg aspect-[4/3] hidden bg-white" alt="">
          <p id="option-a-text" class="font-semibold text-center px-2">選択肢A</p>
        </button>
        <button id="option-b-btn" data-option="B" class="option-btn flex flex-col items-center justify-center p-2 border-4 border-transparent rounded-xl hover:border-blue-500 focus:border-blue-500 transition-all duration-300 space-y-2 bg-gray-50">
          <img id="option-b-img" src="" class="w-full h-auto object-contain rounded-lg aspect-[4/3] hidden bg-white" alt="">
          <p id="option-b-text" class="font-semibold text-center px-2">選択肢B</p>
        </button>
      </div>

      <div id="feedback-container" class="hidden p-4 rounded-lg space-y-4 bg-gray-50 border border-gray-200">
        <div class="text-center">
          <h3 id="feedback-result" class="text-2xl font-bold"></h3>
          <p id="feedback-explanation" class="text-gray-700 mt-2 text-lg"></p>
        </div>
        <div class="flex justify-between items-center pt-2">
          <button id="quiz-back-to-home-btn" class="text-sm text-gray-500 hover:text-gray-700 transition duration-300 whitespace-nowrap">終了する</button>
          <button id="next-question-btn" class="text-lg font-bold text-white bg-green-500 hover:bg-green-600 px-6 py-2 rounded-lg transition duration-300 shadow">次へ</button>
        </div>
      </div>

      <div class="h-10"></div>
    </div>

    <!-- ===== メッセージ ===== -->
    <div id="message-box" class="hidden fixed bottom-5 right-5 bg-red-500 text-white py-3 px-5 rounded-lg shadow-xl z-50 transition-opacity duration-300">
      <p id="message-text"></p>
    </div>
  </div>

  <script>
    // --- 定数・状態 ---
    const STORAGE_KEY_PREFIX = "quiz_maker_data_";
    let currentQuizData = null, currentQuestionIndex = 0, score = 0;

    // --- DOM ---
    const screens = { home: document.getElementById('home-screen'), edit: document.getElementById('edit-screen'), quiz: document.getElementById('quiz-screen') };
    const messageBox = document.getElementById('message-box');
    const messageText = document.getElementById('message-text');

    // Home
    const savedQuizSelect = document.getElementById('saved-quiz-select');
    const importJsonArea = document.getElementById('import-json-area');
    
    // Edit
    const quizNameEdit = document.getElementById('quiz-name-edit');
    const jsonInput = document.getElementById('json-input');
    const editFormsContainer = document.getElementById('edit-forms-container');

    // Quiz
    const questionText = document.getElementById('question-text');
    const questionImgContainer = document.getElementById('question-img-container');
    const questionImg = document.getElementById('question-img');
    const optionABtn = document.getElementById('option-a-btn');
    const optionBBtn = document.getElementById('option-b-btn');
    const optionAImg = document.getElementById('option-a-img');
    const optionBImg = document.getElementById('option-b-img');
    const optionAText = document.getElementById('option-a-text');
    const optionBText = document.getElementById('option-b-text');
    const feedbackContainer = document.getElementById('feedback-container');
    const feedbackResult = document.getElementById('feedback-result');
    const feedbackExplanation = document.getElementById('feedback-explanation');
    const nextQuestionBtn = document.getElementById('next-question-btn');

    // --- 共通関数 ---
    function showScreen(screenName){ Object.values(screens).forEach(s => s.classList.add('hidden')); screens[screenName]?.classList.remove('hidden'); }
    
    function showMessage(message, duration=3000, type='error'){
      messageBox.classList.remove('bg-red-500','bg-green-500','bg-blue-500');
      messageBox.classList.add(type==='success'?'bg-green-500':(type==='info'?'bg-blue-500':'bg-red-500'));
      messageText.textContent = message;
      messageBox.classList.remove('hidden');
      setTimeout(()=>messageBox.classList.add('hidden'), duration);
    }

    // --- Google Drive URL処理 (そのまま維持) ---
    function normalizeImageUrl(raw){
      if(!raw) return { url:"", ok:false, reason:"empty" };
      const url = raw.trim();
      if(/^https?:\/\/photos\.google\.com\/photo\//.test(url)) return { url:"", ok:false, reason:"google_photos_page" };
      if(/^https?:\/\/photos\.app\.goo\.gl\//.test(url)) return { url:"", ok:false, reason:"google_photos_share_link" };
      let m = url.match(/https?:\/\/drive\.google\.com\/file\/d\/([^\/]+)\//);
      if(m && m[1]) return { url:`https://drive.google.com/uc?export=view&id=${m[1]}`, ok:true };
      m = url.match(/https?:\/\/drive\.google\.com\/open\?id=([^&]+)/);
      if(m && m[1]) return { url:`https://drive.google.com/uc?export=view&id=${m[1]}`, ok:true };
      m = url.match(/https?:\/\/drive\.google\.com\/uc\?(?:[^#]*&)?id=([^&]+)/);
      if(m && m[1]) return { url:`https://drive.google.com/uc?export=view&id=${m[1]}`, ok:true };
      if(/^https?:\/\/lh3\.googleusercontent\.com\/[A-Za-z0-9_\-]/.test(url)){
        if(!/[?=]/.test(url)) return { url: url + "=w1600", ok:true }; return { url, ok:true };
      }
      if(/^https?:\/\//.test(url)) return { url, ok:true };
      return { url:"", ok:false, reason:"invalid" };
    }

    function updatePreviewImage(rawUrl, imgElement){
      const { url, ok, reason } = normalizeImageUrl(rawUrl || "");
      imgElement.onerror = null;
      if(!ok){
        imgElement.src = ""; imgElement.classList.add("hidden");
        return false;
      }
      imgElement.classList.remove("hidden");
      // Fallback
      let triedFallback = false;
      imgElement.onerror = () => {
        if(!triedFallback){
          triedFallback = true;
          const m = url.match(/\/uc\?export=view&id=([^&]+)/);
          if(m && m[1]){ imgElement.src = `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1600`; return; }
        }
        imgElement.classList.add("hidden");
      };
      imgElement.src = url;
      return true;
    }

    // --- 編集画面ロジック ---
    function resetEditScreen(){
      quizNameEdit.value = '';
      jsonInput.value = '';
      editFormsContainer.innerHTML = '<p class="text-center text-gray-500">問題を追加してください。</p>';
    }

    function syncJsonFromForm(){
      const questions = buildQuestionsFromForm();
      const data = { questions: questions, updatedAt: new Date().toISOString() };
      jsonInput.value = JSON.stringify(data, null, 2);
    }

    function addQuestion(){
      const questions = buildQuestionsFromForm();
      questions.push({
        question: "新しい問題", explanation: "", answer: "A",
        options: { A: { text: "選択肢A", imageUrl: "" }, B: { text: "選択肢B", imageUrl: "" } },
        questionImageUrl: ""
      });
      renderEditForms(questions);
      syncJsonFromForm();
      setTimeout(()=>editFormsContainer.lastChild?.scrollIntoView({behavior:'smooth'}), 100);
    }

    function deleteQuestion(index){
      const questions = buildQuestionsFromForm();
      questions.splice(index, 1);
      renderEditForms(questions);
      syncJsonFromForm();
    }

    function moveQuestion(index, dir){
      const qs = buildQuestionsFromForm();
      const target = index + dir;
      if(target < 0 || target >= qs.length) return;
      const [moved] = qs.splice(index, 1);
      qs.splice(target, 0, moved);
      renderEditForms(qs);
      syncJsonFromForm();
    }

    function buildQuestionsFromForm(){
      const questions = [];
      document.querySelectorAll('.question-form-block').forEach((_, i)=>{
        const qText = document.getElementById(`q-text-${i}`)?.value ?? "";
        const qImg  = document.getElementById(`q-img-${i}`)?.value.trim() ?? "";
        const aText = document.getElementById(`a-text-${i}`)?.value ?? "";
        const aImg  = document.getElementById(`a-img-${i}`)?.value.trim() ?? "";
        const bText = document.getElementById(`b-text-${i}`)?.value ?? "";
        const bImg  = document.getElementById(`b-img-${i}`)?.value.trim() ?? "";
        const ans   = document.querySelector(`input[name="ans-${i}"]:checked`)?.value || "A";
        const expl  = document.getElementById(`expl-${i}`)?.value ?? "";

        questions.push({
          question: qText, questionImageUrl: qImg,
          explanation: expl, answer: ans,
          options: { A: { text: aText, imageUrl: aImg }, B: { text: bText, imageUrl: bImg } }
        });
      });
      return questions;
    }

    function renderEditForms(questions){
      editFormsContainer.innerHTML = '';
      questions.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'space-y-4 p-4 border border-gray-200 rounded-lg bg-white question-form-block shadow-sm';
        div.innerHTML = `
          <div class="flex justify-between items-center bg-gray-50 p-2 rounded">
            <h3 class="font-bold text-gray-700">問 ${i + 1}</h3>
            <div class="flex gap-2 text-sm">
              <button type="button" class="text-blue-600 hover:underline" onclick="moveQuestion(${i},-1)">↑</button>
              <button type="button" class="text-blue-600 hover:underline" onclick="moveQuestion(${i},1)">↓</button>
              <button type="button" class="text-red-600 hover:underline ml-2" onclick="deleteQuestion(${i})">削除</button>
            </div>
          </div>
          <div>
            <label class="text-xs font-bold text-gray-500">問題文</label>
            <textarea id="q-text-${i}" class="w-full p-2 border rounded text-sm" rows="2" oninput="syncJsonFromForm()">${q.question}</textarea>
            <input type="text" id="q-img-${i}" class="w-full p-2 mt-1 border rounded text-xs" placeholder="画像URL (Drive可)" value="${q.questionImageUrl}" oninput="syncJsonFromForm()">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="p-2 border rounded ${q.answer==='A'?'bg-green-50 border-green-300':''}">
              <div class="flex items-center gap-2 mb-1">
                <input type="radio" name="ans-${i}" value="A" ${q.answer==='A'?'checked':''} onchange="syncJsonFromForm(); renderEditForms(buildQuestionsFromForm())">
                <span class="text-xs font-bold">選択肢A (正解)</span>
              </div>
              <textarea id="a-text-${i}" class="w-full p-1 border rounded text-sm" rows="2" oninput="syncJsonFromForm()">${q.options?.A?.text||''}</textarea>
              <input type="text" id="a-img-${i}" class="w-full p-1 mt-1 border rounded text-xs" placeholder="画像URL" value="${q.options?.A?.imageUrl||''}" oninput="syncJsonFromForm()">
            </div>
            <div class="p-2 border rounded ${q.answer==='B'?'bg-green-50 border-green-300':''}">
              <div class="flex items-center gap-2 mb-1">
                <input type="radio" name="ans-${i}" value="B" ${q.answer==='B'?'checked':''} onchange="syncJsonFromForm(); renderEditForms(buildQuestionsFromForm())">
                <span class="text-xs font-bold">選択肢B (正解)</span>
              </div>
              <textarea id="b-text-${i}" class="w-full p-1 border rounded text-sm" rows="2" oninput="syncJsonFromForm()">${q.options?.B?.text||''}</textarea>
              <input type="text" id="b-img-${i}" class="w-full p-1 mt-1 border rounded text-xs" placeholder="画像URL" value="${q.options?.B?.imageUrl||''}" oninput="syncJsonFromForm()">
            </div>
          </div>
          <div>
            <label class="text-xs font-bold text-gray-500">解説</label>
            <textarea id="expl-${i}" class="w-full p-2 border rounded text-sm" rows="2" oninput="syncJsonFromForm()">${q.explanation||''}</textarea>
          </div>
        `;
        editFormsContainer.appendChild(div);
      });
    }

    // グローバル関数への割り当て（HTML内のonclick用）
    window.moveQuestion = moveQuestion;
    window.deleteQuestion = deleteQuestion;
    window.syncJsonFromForm = syncJsonFromForm;
    window.renderEditForms = renderEditForms;
    window.buildQuestionsFromForm = buildQuestionsFromForm;

    // --- ローカルストレージ & データ操作 ---
    function updateLocalList(){
      savedQuizSelect.innerHTML = '<option value="">選択してください...</option>';
      const keys = [];
      for(let i=0; i<localStorage.length; i++){
        const key = localStorage.key(i);
        if(key.startsWith(STORAGE_KEY_PREFIX)) keys.push(key.replace(STORAGE_KEY_PREFIX, ''));
      }
      keys.sort().forEach(k => {
        const op = document.createElement('option');
        op.value = k; op.textContent = k;
        savedQuizSelect.appendChild(op);
      });
    }

    function saveToLocal(){
      const name = quizNameEdit.value.trim();
      if(!name){ showMessage("クイズ名を入力してください"); return; }
      const qs = buildQuestionsFromForm();
      if(qs.length === 0){ showMessage("問題がありません"); return; }
      
      const data = { questions: qs, updatedAt: new Date().toISOString() };
      try {
        localStorage.setItem(STORAGE_KEY_PREFIX + name, JSON.stringify(data));
        showMessage(`「${name}」をブラウザに保存しました`, 3000, 'success');
        updateLocalList();
        syncJsonFromForm(); // JSON欄も更新
      } catch(e) {
        showMessage("保存できませんでした (容量オーバー等)");
      }
    }

    function loadLocal(mode){
      const name = savedQuizSelect.value;
      if(!name) return;
      const raw = localStorage.getItem(STORAGE_KEY_PREFIX + name);
      if(!raw) return;
      try {
        const data = JSON.parse(raw);
        if(mode === 'edit'){
          resetEditScreen();
          quizNameEdit.value = name;
          renderEditForms(data.questions || []);
          syncJsonFromForm();
          showScreen('edit');
        } else {
          startQuiz(data);
        }
      } catch(e) { showMessage("読み込みエラー"); }
    }

    function deleteLocal(){
      const name = savedQuizSelect.value;
      if(!name) return;
      if(confirm(`「${name}」を削除しますか？`)){
        localStorage.removeItem(STORAGE_KEY_PREFIX + name);
        updateLocalList();
        showMessage("削除しました", 3000, 'info');
      }
    }

    // --- インポート & コピー ---
    function importAndPlay(){
      const txt = importJsonArea.value.trim();
      if(!txt){ showMessage("JSONを入力してください"); return; }
      try {
        const data = JSON.parse(txt);
        if(!data.questions || !Array.isArray(data.questions)) throw new Error("形式が違います");
        startQuiz(data);
      } catch(e) { showMessage("JSON形式エラー: " + e.message); }
    }

    async function copyJsonToClipboard(){
      const txt = jsonInput.value;
      if(!txt) return;
      try {
        await navigator.clipboard.writeText(txt);
        showMessage("コピーしました！ iPadに送ってください。", 3000, 'success');
      } catch(e) {
        jsonInput.select();
        document.execCommand('copy');
        showMessage("テキストを選択しました。手動でコピーしてください。", 3000, 'info');
      }
    }

    // --- クイズ実行ロジック ---
    function startQuiz(data){
      currentQuizData = data;
      currentQuestionIndex = 0; score = 0;
      displayQuestion(0);
      showScreen('quiz');
    }

    function displayQuestion(index){
      const q = currentQuizData.questions[index];
      resetFeedback();
      
      // 画像
      if(q.questionImageUrl){
        questionImgContainer.classList.remove('hidden');
        updatePreviewImage(q.questionImageUrl, questionImg);
      } else {
        questionImgContainer.classList.add('hidden');
      }

      // テキスト (改行対応)
      questionText.innerHTML = (q.question||"").replace(/\n/g, "<br>");

      // 選択肢
      optionAText.innerHTML = (q.options.A.text||"").replace(/\n/g, "<br>");
      optionBText.innerHTML = (q.options.B.text||"").replace(/\n/g, "<br>");
      
      updatePreviewImage(q.options.A.imageUrl, optionAImg);
      updatePreviewImage(q.options.B.imageUrl, optionBImg);
    }

    function resetFeedback(){
      feedbackContainer.classList.add('hidden');
      optionABtn.disabled = false; optionBBtn.disabled = false;
      optionABtn.classList.remove('opacity-50', 'ring-4', 'ring-green-400', 'ring-red-400');
      optionBBtn.classList.remove('opacity-50', 'ring-4', 'ring-green-400', 'ring-red-400');
    }

    function checkAnswer(selected){
      optionABtn.disabled = true; optionBBtn.disabled = true;
      const q = currentQuizData.questions[currentQuestionIndex];
      const isCorrect = (selected === q.answer);
      
      if(isCorrect) score++;
      
      // UI feedback
      feedbackResult.textContent = isCorrect ? "正解！" : "ざんねん…";
      feedbackResult.className = isCorrect ? "text-2xl font-bold text-green-500" : "text-2xl font-bold text-red-500";
      feedbackExplanation.innerHTML = (q.explanation || "").replace(/\n/g, "<br>");
      
      feedbackContainer.classList.remove('hidden');
      
      // ボタンの色付け
      const btn = selected === 'A' ? optionABtn : optionBBtn;
      btn.classList.add('ring-4', isCorrect ? 'ring-green-400' : 'ring-red-400');
      (selected === 'A' ? optionBBtn : optionABtn).classList.add('opacity-50');
    }

    function nextQuestion(){
      currentQuestionIndex++;
      if(currentQuestionIndex < currentQuizData.questions.length){
        displayQuestion(currentQuestionIndex);
      } else {
        showFinalResult();
      }
    }

    function showFinalResult(){
      questionText.textContent = "終了！";
      questionImgContainer.classList.add('hidden');
      document.getElementById('options-container').classList.add('hidden'); // 選択肢を隠す
      
      feedbackResult.textContent = `${currentQuizData.questions.length}問中 ${score}問正解！`;
      feedbackResult.className = "text-3xl font-bold text-blue-600";
      feedbackExplanation.textContent = "おつかれさまでした。";
      feedbackContainer.classList.remove('hidden');
      nextQuestionBtn.classList.add('hidden');
    }

    // --- 初期化 & イベントリスナー ---
    document.getElementById('create-new-quiz-btn').addEventListener('click', ()=>{
      resetEditScreen();
      showScreen('edit');
    });
    document.getElementById('back-to-home-btn').addEventListener('click', ()=>showScreen('home'));
    document.getElementById('quiz-back-to-home-btn').addEventListener('click', ()=>{
      showScreen('home');
      document.getElementById('options-container').classList.remove('hidden'); // 復活させる
    });

    document.getElementById('add-question-btn').addEventListener('click', addQuestion);
    document.getElementById('save-local-btn').addEventListener('click', saveToLocal);
    document.getElementById('copy-json-btn').addEventListener('click', copyJsonToClipboard);

    document.getElementById('load-local-edit-btn').addEventListener('click', ()=>loadLocal('edit'));
    document.getElementById('load-local-play-btn').addEventListener('click', ()=>loadLocal('play'));
    document.getElementById('delete-local-btn').addEventListener('click', deleteLocal);

    document.getElementById('import-play-btn').addEventListener('click', importAndPlay);

    document.getElementById('option-a-btn').addEventListener('click', ()=>checkAnswer('A'));
    document.getElementById('option-b-btn').addEventListener('click', ()=>checkAnswer('B'));
    document.getElementById('next-question-btn').addEventListener('click', nextQuestion);

    // テキストエリアの同期
    jsonInput.addEventListener('input', ()=>{
      try {
        const d = JSON.parse(jsonInput.value);
        if(d.questions) renderEditForms(d.questions);
      } catch(e){}
    });

    updateLocalList();
    showScreen('home');
  </script>
</body>
</html>
